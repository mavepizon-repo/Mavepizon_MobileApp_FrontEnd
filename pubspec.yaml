name: mavepizon
description: Mavepizon Technologies Pvt Ltd
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Network & API
  dio: ^5.4.0
  http: ^1.0.0
  http_parser: ^4.0.2
  excel: ^4.0.6
  
  # Storage
  shared_preferences: ^2.2.2
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Utilities
  intl: ^0.19.0
  bcrypt: ^1.1.3
  
  # File Handling
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  url_launcher: ^6.2.2
  flutter_pdfview: ^1.4.3
  
  # Charts
  fl_chart: ^0.69.0
  path_provider: ^2.1.0
  share_plus: ^9.0.0

  # GPS / Location
  geolocator: ^12.0.0
  razorpay_flutter: ^1.4.5
  open_filex: ^4.7.0
  file_saver: ^0.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/images/mavepizon_logo.jpeg